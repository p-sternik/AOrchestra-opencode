name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Optional existing release tag to publish/retry on npm
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-main:
    uses: ./.github/workflows/validate.yml
  release:
    needs: validate-main
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pr-number: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  validate-release-pr:
    needs: release
    if: ${{ needs.release.outputs.pr-number != '' }}
    uses: ./.github/workflows/validate.yml
    with:
      ref: refs/pull/${{ needs.release.outputs.pr-number }}/head

  publish-npm:
    needs: release
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && (needs.release.outputs.release_created == 'true' || inputs.publish_tag != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.publish_tag || needs.release.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate published GitHub release
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq 'if .isDraft then error("Draft release") else true end'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.2.15'
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - name: Check version matches tag
        run: node -e 'if(require("./package.json").version!==process.env.RELEASE_TAG)process.exit(1)'
      - run: npm ci --ignore-scripts
      - run: bun run typecheck
      - run: bun run test
      - run: npm run pack:check
      - name: Check registry version
        id: registry
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const response=await fetch(`https://registry.npmjs.org/${encodeURIComponent(p.name)}/${p.version}`);
          if(response.status!==200&&response.status!==404)throw new Error(`Registry HTTP ${response.status}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`exists=${response.status===200}\n`);
          JS
      - name: Publish with npm Trusted Publishing
        if: steps.registry.outputs.exists != 'true'
        run: npm publish --provenance --access public --ignore-scripts
      - name: Already published
        if: steps.registry.outputs.exists == 'true'
        run: echo "This version is already published; no upload was attempted."
