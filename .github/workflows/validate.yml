name: Validate

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      record_validation:
        description: Store evidence after the complete validation matrix succeeds
        type: boolean
        default: true
      ref:
        description: Git ref to validate
        type: string
        required: false

# PR updates supersede old checks. Reusable calls are isolated by run and ref,
# so validating a release PR cannot cancel its caller or another release stage.
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}-${{ inputs.ref || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node-version: ['22']
        include:
          - os: ubuntu-24.04
            node-version: '24'
            npm-version: '12.2.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Match npm publication toolchain
        if: matrix.npm-version != ''
        run: npm install --global npm@${{ matrix.npm-version }} --ignore-scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.2.15'
      - run: npm ci --ignore-scripts
      - if: matrix.os == 'ubuntu-24.04' && matrix.node-version == '24'
        run: npm run format:check
      - run: bun run typecheck
      - run: bun run test
      - if: matrix.os == 'ubuntu-24.04' && matrix.node-version == '24'
        run: bun run eval:check
      - if: matrix.os == 'ubuntu-24.04' && matrix.node-version == '24'
        run: python -m unittest discover -s tests -p '*_test.py'
      - if: matrix.os == 'ubuntu-24.04' && matrix.node-version == '24'
        run: bun scripts/version-check.ts
      - run: npm run pack:check

  receipt:
    if: inputs.record_validation
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Record successful matrix validation
        # Older release tags may not contain the helper script.
        run: |
          python - <<'PYTHON'
          import json, os, subprocess
          def git(ref):
              return subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
          with open('validation.json', 'w') as output:
              json.dump(dict(sha=git('HEAD'), tree=git('HEAD^{tree}'),
                  repository=os.environ['GITHUB_REPOSITORY'],
                  run_id=os.environ['GITHUB_RUN_ID'],
                  run_attempt=os.environ['GITHUB_RUN_ATTEMPT']), output)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ inputs.ref || github.sha }}-${{ github.run_attempt }}
          path: validation.json
          if-no-files-found: error
          retention-days: 90
