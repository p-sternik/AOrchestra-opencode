name: Validate

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate
        type: string
        required: false

# PR updates supersede old checks. Reusable calls are isolated by run and ref,
# so validating a release PR cannot cancel its caller or another release stage.
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}-${{ inputs.ref || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node-version: ['22']
        include:
          - os: ubuntu-24.04
            node-version: '24'
            npm-version: '12.2.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Match npm publication toolchain
        if: matrix.npm-version != ''
        run: npm install --global npm@${{ matrix.npm-version }} --ignore-scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.2.15'
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run eval:check
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: bun scripts/version-check.ts
      - run: npm run pack:check
