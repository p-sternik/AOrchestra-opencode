name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Optional existing release tag to publish/retry on npm
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-main:
    uses: ./.github/workflows/validate.yml
  release:
    needs: validate-main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pr-number: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number }}
      pr-head-sha: ${{ steps.snapshot.outputs.sha }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Capture release PR revision
        if: steps.release.outputs.pr != ''
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  validate-release-pr:
    needs: release
    if: ${{ needs.release.outputs.pr-number != '' }}
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.release.outputs.pr-head-sha }}

  merge-release-pr:
    needs: [release, validate-release-pr]
    if: ${{ needs.release.outputs.pr-number != '' && inputs.publish_tag == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.release.outputs.pr-number }}
      PR_HEAD_SHA: ${{ needs.release.outputs.pr-head-sha }}
    steps:
      - name: Merge validated release PR and continue release
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '
            if .state == "open" and .draft == false
              and .base.ref == "main"
              and .base.repo.full_name == env.GITHUB_REPOSITORY
              and .head.repo.full_name == env.GITHUB_REPOSITORY
              and .head.sha == env.PR_HEAD_SHA
              and .user.login == "github-actions[bot]"
              and any(.labels[]; .name == "autorelease: pending")
            then .number else error("Release PR identity or validated revision changed") end'
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha="$PR_HEAD_SHA" -f merge_method=squash \
            --jq 'if .merged then .sha else error(.message) end'
          # GITHUB_TOKEN merges do not trigger push workflows; dispatch explicitly.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main

  publish-npm:
    needs: release
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && (needs.release.outputs.release_created == 'true' || inputs.publish_tag != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.publish_tag || needs.release.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate published GitHub release
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq 'if .isDraft then error("Draft release") else true end'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.2.15'
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - name: Check version matches tag
        run: node -e 'if(require("./package.json").version!==process.env.RELEASE_TAG)process.exit(1)'
      - run: npm ci --ignore-scripts
      - run: bun run typecheck
      - run: bun run test
      - run: bun scripts/version-check.ts
      - run: npm run pack:check
      - name: Pack release and verify registry integrity
        id: registry
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const parsed=JSON.parse(execFileSync('npm',['pack','--json','--ignore-scripts'],{encoding:'utf8'}));
          const packed=Array.isArray(parsed)?parsed[0]:(parsed.files?parsed:parsed[p.name]);
          if(!packed?.filename || !packed?.integrity)throw new Error('Packed archive metadata missing');
          const response=await fetch(`https://registry.npmjs.org/${encodeURIComponent(p.name)}/${p.version}`);
          if(response.status!==200&&response.status!==404)throw new Error(`Registry HTTP ${response.status}`);
          if(response.status===200){
            const published=await response.json();
            if(published.name!==p.name || published.version!==p.version || published.dist?.integrity!==packed.integrity)
              throw new Error('Published version differs from the tagged package; investigate without replacing the immutable version');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`exists=${response.status===200}\narchive=${packed.filename}\n`);
          JS
      - name: Publish with npm Trusted Publishing
        if: steps.registry.outputs.exists != 'true'
        env:
          RELEASE_ARCHIVE: ${{ steps.registry.outputs.archive }}
        run: npm publish "$RELEASE_ARCHIVE" --provenance --access public --ignore-scripts
      - name: Already published
        if: steps.registry.outputs.exists == 'true'
        run: echo "Registry integrity matches the tagged package; no upload was attempted."
